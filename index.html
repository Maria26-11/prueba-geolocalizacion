<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asistencia - Grit Box</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 450px;

            background-color: #1c1c1c;
            border: 1px solid #333;
            border-radius: 15px;

            padding: 25px;
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
        }

        p {
            color: #ddd;
            line-height: 1.5;
        }

        button {
            width: 100%;

            padding: 15px;
            margin-top: 12px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .boton-guardar {
            background-color: #f9d900;
            color: black;
        }

        .boton-asistencia {
            background-color: white;
            color: black;
        }

        .boton-borrar {
            background-color: #333;
            color: white;
        }

        #resultado {
            margin-top: 20px;

            background-color: #252525;

            border-radius: 10px;

            padding: 15px;

            line-height: 1.6;

            white-space: pre-line;
        }

        #ubicacionGuardada {
            margin-top: 15px;

            font-size: 14px;
            color: #bbb;
        }

        .correcto {
            border-left: 5px solid #39d98a;
        }

        .incorrecto {
            border-left: 5px solid #ff5c5c;
        }

        .informacion {
            border-left: 5px solid #f9d900;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>📍 Asistencia Grit Box</h1>

        <p>
            Para registrar su asistencia debe encontrarse
            físicamente en Grit Box.
        </p>

        <!-- ESTE BOTÓN SOLO LO USAMOS PARA LA PRUEBA -->
        <button
            class="boton-guardar"
            id="guardarUbicacion">

            Guardar ubicación de Grit Box

        </button>


        <button
            class="boton-asistencia"
            id="registrarAsistencia">

            Registrar asistencia

        </button>


        <button
            class="boton-borrar"
            id="borrarUbicacion">

            Borrar ubicación guardada

        </button>


        <div
            id="resultado"
            class="informacion">

            Presione "Registrar asistencia".

        </div>


        <div id="ubicacionGuardada"></div>

    </div>


    <script>

        /*
            RADIO PERMITIDO

            El cliente solamente puede registrar
            asistencia si está a 80 metros o menos
            de Grit Box.
        */

        const RADIO_PERMITIDO = 20;


        const resultado =
            document.getElementById("resultado");

        const ubicacionGuardada =
            document.getElementById("ubicacionGuardada");



        function mostrarMensaje(mensaje, tipo) {

            resultado.className = tipo;

            resultado.id = "resultado";

            resultado.textContent = mensaje;

        }



        /*
            MOSTRAR SI YA TENEMOS
            GUARDADA LA UBICACIÓN
            DE GRIT BOX
        */

        function mostrarUbicacionGuardada() {

            const datos =
                localStorage.getItem("ubicacionGritBox");


            if (datos === null) {

                ubicacionGuardada.textContent =
                    "Todavía no se ha guardado la ubicación de Grit Box.";

                return;
            }


            const gimnasio =
                JSON.parse(datos);


            ubicacionGuardada.textContent =
                "📍 Ubicación de Grit Box guardada.";

        }



        /*
            OBTENER UBICACIÓN ACTUAL
            DEL CELULAR
        */

        function obtenerUbicacion(funcion) {

            if (!navigator.geolocation) {

                mostrarMensaje(

                    "❌ Su dispositivo no permite utilizar la ubicación.",

                    "incorrecto"

                );

                return;

            }


            mostrarMensaje(

                "📍 Comprobando su ubicación...",

                "informacion"

            );


            navigator.geolocation.getCurrentPosition(

                funcion,


                function (error) {

                    let mensaje =
                        "No fue posible obtener su ubicación.";


                    if (error.code === 1) {

                        mensaje =
                            "Debe permitir el acceso a su ubicación para registrar asistencia.";

                    }


                    if (error.code === 2) {

                        mensaje =
                            "No fue posible determinar su ubicación.";

                    }


                    if (error.code === 3) {

                        mensaje =
                            "Se agotó el tiempo intentando obtener su ubicación.";

                    }


                    mostrarMensaje(

                        "❌ " + mensaje,

                        "incorrecto"

                    );

                },


                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }

            );

        }



        /*
            CALCULAR LA DISTANCIA
            ENTRE EL CLIENTE Y
            GRIT BOX
        */

        function calcularDistancia(
            latitud1,
            longitud1,
            latitud2,
            longitud2
        ) {

            const RADIO_TIERRA = 6371000;

            const radianes =
                Math.PI / 180;


            const diferenciaLatitud =
                (latitud2 - latitud1)
                * radianes;


            const diferenciaLongitud =
                (longitud2 - longitud1)
                * radianes;


            const calculo =

                Math.sin(
                    diferenciaLatitud / 2
                ) ** 2

                +

                Math.cos(
                    latitud1 * radianes
                )

                *

                Math.cos(
                    latitud2 * radianes
                )

                *

                Math.sin(
                    diferenciaLongitud / 2
                ) ** 2;


            const angulo =

                2

                *

                Math.atan2(

                    Math.sqrt(calculo),

                    Math.sqrt(1 - calculo)

                );


            return RADIO_TIERRA * angulo;

        }



        /*
            GUARDAR UBICACIÓN
            DE GRIT BOX

            IMPORTANTE:
            ESTE BOTÓN SE DEBE PRESIONAR
            ESTANDO FÍSICAMENTE
            EN EL GIMNASIO.
        */

        document
            .getElementById("guardarUbicacion")
            .addEventListener(
                "click",
                function () {


                    obtenerUbicacion(

                        function (posicion) {


                            const gimnasio = {

                                latitud:
                                    posicion.coords.latitude,

                                longitud:
                                    posicion.coords.longitude

                            };


                            localStorage.setItem(

                                "ubicacionGritBox",

                                JSON.stringify(gimnasio)

                            );


                            mostrarUbicacionGuardada();


                            mostrarMensaje(

                                "✅ Ubicación de Grit Box guardada correctamente."
                                +
                                "\n\nAhora puede probar el registro de asistencia.",

                                "correcto"

                            );

                        }

                    );

                }
            );



        /*
            REGISTRAR ASISTENCIA
        */

        document
            .getElementById("registrarAsistencia")
            .addEventListener(
                "click",
                function () {


                    const datos =
                        localStorage.getItem(
                            "ubicacionGritBox"
                        );


                    /*
                        SI NO HEMOS GUARDADO
                        LA UBICACIÓN DEL GIMNASIO
                    */

                    if (datos === null) {

                        mostrarMensaje(

                            "❌ Primero debe guardar la ubicación de Grit Box.",

                            "incorrecto"

                        );

                        return;

                    }


                    const gimnasio =
                        JSON.parse(datos);



                    /*
                        OBTENER UBICACIÓN
                        ACTUAL DEL CLIENTE
                    */

                    obtenerUbicacion(

                        function (posicion) {


                            const latitudCliente =
                                posicion.coords.latitude;


                            const longitudCliente =
                                posicion.coords.longitude;


                            const precision =
                                posicion.coords.accuracy;



                            /*
                                CALCULAR DISTANCIA
                            */

                            const distancia =
                                calcularDistancia(

                                    latitudCliente,

                                    longitudCliente,

                                    gimnasio.latitud,

                                    gimnasio.longitud

                                );



                            /*
                                SI ESTÁ DENTRO
                                DEL RADIO DEL GIMNASIO
                            */

                            if (
                                distancia <= RADIO_PERMITIDO
                            ) {


                                const fecha =
                                    new Date();


                                mostrarMensaje(

                                    "✅ ASISTENCIA REGISTRADA"
                                    +
                                    "\n\nSe encuentra dentro de Grit Box."
                                    +
                                    "\n\nDistancia al gimnasio: "
                                    +
                                    Math.round(distancia)
                                    +
                                    " metros."
                                    +
                                    "\n\nFecha: "
                                    +
                                    fecha.toLocaleDateString()
                                    +
                                    "\nHora: "
                                    +
                                    fecha.toLocaleTimeString(),

                                    "correcto"

                                );

                            }


                            /*
                                SI ESTÁ FUERA
                                DEL GIMNASIO
                            */

                            else {


                                mostrarMensaje(

                                    "❌ NO PUEDE REGISTRAR LA ASISTENCIA"
                                    +
                                    "\n\nNo se encuentra en Grit Box."
                                    +
                                    "\n\nActualmente está aproximadamente a "
                                    +
                                    Math.round(distancia)
                                    +
                                    " metros del gimnasio."
                                    +
                                    "\n\nDebe encontrarse a "
                                    +
                                    RADIO_PERMITIDO
                                    +
                                    " metros o menos para registrar su asistencia.",

                                    "incorrecto"

                                );

                            }

                        }

                    );

                }
            );



        /*
            BORRAR UBICACIÓN
            GUARDADA
        */

        document
            .getElementById("borrarUbicacion")
            .addEventListener(
                "click",
                function () {


                    localStorage.removeItem(
                        "ubicacionGritBox"
                    );


                    mostrarUbicacionGuardada();


                    mostrarMensaje(

                        "Ubicación de Grit Box eliminada.",

                        "informacion"

                    );

                }
            );


        mostrarUbicacionGuardada();

    </script>

</body>

</html>
